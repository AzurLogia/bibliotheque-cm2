<head>
<meta charset="utf-8">

<title>School Supplies — Flashcards aléatoires</title>
<style>
:root {font-family:Arial,Helvetica,sans-serif;color:#20365a;background:#f3f6fb}
*{box-sizing:border-box}
body{margin:0}
header{padding:15px 22px;background:#17375d;color:white;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{font-size:22px;margin:0}
.controls{display:flex;gap:9px;flex-wrap:wrap}
button{font:600 15px Arial;cursor:pointer;border:0;border-radius:9px;padding:11px 15px;background:#e8eef7;color:#17375d}
button:hover{filter:brightness(.95)}
button.primary{background:#f8d56b}
button:disabled{opacity:.4;cursor:default}
main{max-width:1160px;margin:18px auto;padding:0 16px}
.stage{background:#fff;border:2px solid #dae4f2;border-radius:18px;min-height:min(68vh,680px);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.stage img{max-width:90%;max-height:62vh;object-fit:contain}
.answer{background:#17375d;color:#fff;width:100%;min-height:min(68vh,680px);display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-weight:750;font-size:clamp(42px,7vw,96px);line-height:1.12}
.title{font-size:clamp(50px,8vw,105px);color:#17375d;text-align:center;font-weight:800}
.status{display:flex;align-items:center;justify-content:space-between;margin:12px 4px;gap:15px;color:#526681;font-size:14px}
footer{text-align:center;color:#64748b;font-size:13px;margin:18px}
body.fullscreen header,body.fullscreen footer,body.fullscreen .status{display:none}
body.fullscreen main{max-width:none;margin:0;padding:0}
body.fullscreen .stage{border:0;border-radius:0;min-height:100vh}
body.fullscreen .stage img{max-height:90vh;max-width:94vw}
body.fullscreen .answer{min-height:100vh}
@media(max-width:680px){header{padding:12px}header h1{font-size:18px}.stage{min-height:55vh}.answer{min-height:55vh}}
</style>
</head>

let order = [], step = -1;
const stage = document.getElementById("stage");
const progress = document.getElementById("progress");
const next = document.getElementById("next");
function mix() {
 order = CARDS.map((_,i)=>i);
 for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
 step=-1; render();
}
function render(){
 stage.replaceChildren();
 if(step<0){
  const h=document.createElement("div");h.className="title";h.textContent="School Supplies";stage.append(h);
  progress.textContent="Prêt · 14 objets mélangés";
  next.textContent="Commencer →";
 } else if(step>=28){
  const h=document.createElement("div");h.className="title";h.textContent="Well done!";stage.append(h);
  progress.textContent="Terminé · 14 / 14";
  next.textContent="Recommencer ↻";
 } else {
  const n=Math.floor(step/2), card=CARDS[order[n]], answer=step%2===1;
  if(answer){const d=document.createElement("div");d.className="answer";d.textContent=card.answer;stage.append(d);}
  else {const im=document.createElement("img");im.src=card.image;im.alt="Objet scolaire à nommer";stage.append(im);}
  progress.textContent=`Objet ${n+1} / 14 · ${answer?"Réponse":"Image"}`;
  next.textContent=answer?"Objet suivant →":"Voir la réponse →";
 }
}
function forward(){if(step>=28){mix();return;}step++;render();}
function back(){if(step>-1){step--;render();}}
next.addEventListener("click",forward);
document.getElementById("shuffle").addEventListener("click",mix);
document.getElementById("fullscreen").addEventListener("click",()=>{
 document.body.classList.toggle("fullscreen");
 document.getElementById("fullscreen").textContent=document.body.classList.contains("fullscreen")?"Quitter le plein écran":"⛶ Plein écran";
});
document.addEventListener("keydown",e=>{
 if(["ArrowRight"," ","Enter"].includes(e.key)){if(e.target.tagName!=="BUTTON"){e.preventDefault();forward();}}
 if(e.key==="ArrowLeft"){e.preventDefault();back();}
 if(e.key==="Escape" && document.body.classList.contains("fullscreen")){document.body.classList.remove("fullscreen");document.getElementById("fullscreen").textContent="⛶ Plein écran";}
});
mix();
</script>
</body></html>
