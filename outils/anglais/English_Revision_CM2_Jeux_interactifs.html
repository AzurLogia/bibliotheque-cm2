function nextItem(bagName,pool){let bag=bags[bagName];if(!bag || !bag.length){bag=shuffle(pool);bags[bagName]=bag}let ob=bag.pop();bags[bagName]=bag;return ob}
function newQuestion(){student=drawName();selectedTF=null;let pool=eligible(active);if(active==='flash'){let x=nextItem('faceBag',pool);cur={x};phase='guess'}
 else if(active==='missing'){let ids=shuffle(pool).slice(0,9);let removed=pick(ids);cur={before:ids,after:shuffle(ids.filter(i=>i.id!==removed.id)),removed};phase='study'}
 else if(active==='tf'){let x=nextItem('questionBag',pool);if(!truthBag.length)truthBag=shuffle([true,false,true,false,true,false,true,false]);let truth=truthBag.pop();let other=truth?x:pick(pool.filter(i=>i.id!==x.id&&i.kind===x.kind));cur={x,shown:other,truth};phase='question'}
 else if(active==='count'){let size=settings.countN==='random'?rand(3,5):Number(settings.countN);let nDuplicates=settings.repeat&&Math.random()<.72?rand(1,Math.min(2,size-1)):0;let list=shuffle(pool.filter(i=>i.idRaw!=='pencil_case')).slice(0,size-nDuplicates);for(let k=0;k<nDuplicates;k++)list.push(pick(list));cur={list:shuffle(list)};phase='question'}
 else if(active==='have'){let p=pool.filter(i=>i.idRaw!=='pencil_case');let target=nextItem('questionBag',p);let isPresent=Math.random()<.5;let rest=shuffle(p.filter(i=>i.id!==target.id)).slice(0,isPresent?3:4);let bag=shuffle(isPresent?[...rest,target]:rest);cur={target,bag,isPresent};phase='formulate'}
 else if(active==='match'){let p=pool;let x=nextItem('questionBag',p),options=shuffle([x,...shuffle(p.filter(i=>i.id!==x.id)).slice(0,3)]);cur={x,options,answer:'ABCD'[options.findIndex(y=>y.id===x.id)]};phase='guess'}
 render()}
function start(g){active=g;round=1;total=roundLimit();usedNames=[];bags={};questionBag=[];matchBag=[];truthBag=[];faceBag=[];newQuestion()}
function next(){if(round>=total){phase='end';render()}else{round++;newQuestion()}}
function modeControls(){return `<div class="globalbar"><div class="grp"><span class="micro">Vocabulaire :</span><select id="topic" aria-label="Vocabulaire"><option value="both" ${settings.topic==='both'?'selected':''}>Les deux thèmes (27)</option><option value="school" ${settings.topic==='school'?'selected':''}>School supplies (14)</option><option value="class" ${settings.topic==='class'?'selected':''}>Classroom instructions (13)</option></select></div><div class="grp"><span class="micro">Participation :</span><div class="modeBtns"><button data-act="group" class="${settings.mode==='group'?'on':''}">✏️ Ardoises / collectif</button><button data-act="individual" class="${settings.mode==='individual'?'on':''}">🎲 Élève individuel</button></div></div></div>`}
function renderHome(){const list=[['flash','🃏','Les deux thèmes','Une image, aucun mot : on nomme ou on mime avant de vérifier.'],['missing','👀','Les deux thèmes','Neuf images mémorisées, une disparaît et les huit autres bougent.'],['tf','✅','Les deux thèmes','Une image, une affirmation : vrai ou faux, puis correction.'],['count','🔢','School supplies','3 à 5 images, avec des doublons possibles, sans amorce de phrase.'],['have','💬','School supplies','Formule une question et réponds selon le contenu de la trousse.'],['match','🧩','Classroom instructions','Une consigne en anglais, quatre images : trouve A, B, C ou D.']];root.innerHTML=`<section class="hero"><div class="kicker">Révisions · Anglais · CM2</div><h1>English revision <span>challenge!</span></h1><p>6 activités interactives · 14 fournitures + 13 consignes · illustrations de notre séquence · utilisable hors connexion.</p></section>${modeControls()}<section class="cards">${list.map(([k,emoji,topic,desc])=>`<div class="card"><div class="cardtop"><div class="em">${emoji}</div><div class="tag">${topic}</div></div><h2>${esc(TITLES[k])}</h2><p>${desc}</p><button data-act="start" data-game="${k}">Commencer →</button></div>`).join('')}</section><p class="smallprint">Raccourcis au clavier : espace = étape suivante / correction, flèche droite = manche suivante après la correction, F = plein écran. Les réglages et prénoms sont conservés sur cet ordinateur.</p>`}
function studentControls(){if(settings.mode==='group')return `<div class="studentbox"><span class="collective">✏️ Toute la classe · réponse sur ardoise</span><span class="smalllabel">Change de mode sur l’accueil si besoin.</span></div>`;let avail=settings.present.filter(n=>settings.names.includes(n));return `<div class="studentbox"><span class="smalllabel">ÉLÈVE INTERROGÉ</span><span class="picked">${student?esc(student):'Aucun élève sélectionné'}</span><button class="little" data-act="draw">🎲 Tirer au sort</button><span class="smalllabel">ou choisir :</span><select id="pickstudent" aria-label="Choisir un élève"><option value="">— Choix manuel —</option>${avail.map(n=>`<option value="${esc(n)}" ${student===n?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`}
function wrapper(inner){root.innerHTML=`<div class="gameheading"><div><button class="back" data-act="home">← Accueil des jeux</button><h1>${TITLES[active]}</h1><div class="subline">${SUBS[active]}</div></div><div class="round">${round} / ${Number.isFinite(total)?total:'∞'}</div></div>${studentControls()}${inner}<div class="smallfoot">Images cadrées sans recadrage · Illustrations issues des ressources déjà utilisées en classe.</div>`}
function render(){if(!active){renderHome();return}if(phase==='end'){wrapper(`<div class="stage end"><div style="font-size:60px">🏆</div><div class="kicker">Mission accomplished</div><h2>Great job!</h2><p>La série est terminée. Pour une nouvelle séance, relance l’activité ou change de jeu.</p><div class="buttons">${btn('restart','Nouvelle série ↻','primary')}${btn('home','Choisir un autre jeu')}</div></div>`);return}
 let inner='';if(active==='flash')inner=renderFlash();else if(active==='missing')inner=renderMissing();else if(active==='tf')inner=renderTF();else if(active==='count')inner=renderCount();else if(active==='have')inner=renderHave();else if(active==='match')inner=renderMatch();wrapper(inner)}
function renderFlash(){let done=phase==='revealed';return `<div class="stage"><div class="stageheading"><div class="micro">LOOK • THINK • SAY</div><h2>${cur.x.kind==='c'?'Quelle consigne représente cette illustration ?':'Quel est cet objet en anglais ?'}</h2><p>${cur.x.kind==='c'?'Prononce et mime la consigne.':'Nomme la fourniture sans modèle écrit.'}</p></div><div class="bigpicture">${im(cur.x)}</div>${done?`<div class="callout">${esc(cur.x.label)}</div>`:''}</div><div class="buttons">${done?btn('next','Image suivante →','primary'):btn('reveal','Révéler le mot','green')}${btn('restart','Nouvelle série')}</div>`}
function renderMissing(){let st=phase==='study',closed=phase==='closed',done=phase==='revealed';let l=st||closed?cur.before:cur.after;let cls=st||closed?'grid9':'grid8';return `<div class="stage"><div class="stageheading"><div class="micro">MEMORY • LOOK CAREFULLY</div><h2>${st?'Mémorise les 9 images.':closed?'Les images changent de place…':done?'Correct answer':'What’s missing?'}</h2><p>${st?'Aucune case vide : regarde bien tous les objets.':closed?'Garde les yeux fermés.':done?'L’image disparue était…':'Écris sur ton ardoise l’objet ou la consigne disparu(e).'}</p></div><div class="${cls}">${l.map(x=>`<div class="slot">${im(x)}</div>`).join('')}</div>${closed?`<div class="veil"><div style="font-size:56px">🙈</div><h2>Eyes closed!</h2><p>Un élément disparaît et tous les autres changent de place.</p><button data-act="open">👀 Ouvrir les yeux</button></div>`:''}${done?`<div class="callout missinganswer">${im(cur.removed,'objimg')}<span>${esc(cur.removed.label)}</span></div>`:''}</div><div class="buttons">${st?btn('hide','🙈 Fermez les yeux','primary'):closed?'':done?btn('next','Nouvelle manche →','primary'):btn('reveal','Afficher la réponse','green')}${btn('restart','Nouvelle série')}</div>`}
function renderTF(){let done=phase==='answered';let isCorrect=selectedTF===cur.truth;let shown=cur.shown;let statement=cur.x.kind==='s'?((shown.idRaw==='scissors'||shown.idRaw==='coloured_pencils')?`These are ${shown.label}.`:`This is ${shown.label.replace(/^a rubber \/ an eraser$/,'a rubber')}.`):`This means: “${shown.label}”`;return `<div class="stage"><div class="stageheading"><div class="micro">TRUE OR FALSE?</div><h2>Observe et juge l’affirmation.</h2></div><div class="bigpicture">${im(cur.x)}</div><div class="tfstatement">${esc(statement)}</div>${done?`<div class="callout ${isCorrect?'':'bad'}">${isCorrect?'✓ Bonne réponse':'✗ À revoir'} · ${cur.truth?'TRUE':'FALSE'}<div style="font-size:16px;margin-top:4px">L’image représente : ${esc(cur.x.label)}</div></div>`:`<div class="tfbuttons"><button class="true" data-act="true">✓ TRUE</button><button class="false" data-act="false">✕ FALSE</button></div>`}</div><div class="buttons">${done?btn('next','Question suivante →','primary'):''}${btn('restart','Nouvelle série')}</div>`}
const NUMS=['zero','one','two','three','four','five'];
function quantWord(ob,n){if(ob.idRaw==='coloured_pencils')return n===1?'one set of coloured pencils':`${NUMS[n]} sets of coloured pencils`;if(ob.idRaw==='scissors')return n===1?'one pair of scissors':`${NUMS[n]} pairs of scissors`;if(ob.idRaw==='correction_tape')return n===1?'one correction tape dispenser':`${NUMS[n]} correction tape dispensers`;return `${NUMS[n]} ${n===1?ob.countOne:ob.countMany}`}
function sentence(list){let order=[],counts={};list.forEach(o=>{if(!counts[o.id]){counts[o.id]=0;order.push(o)}counts[o.id]++});let parts=order.map(o=>quantWord(o,counts[o.id]));return 'In my pencil case, I have got '+(parts.length>1?parts.slice(0,-1).join(', ')+' and '+parts.at(-1):parts[0])+'.'}
function renderCount(){let done=phase==='revealed';return `<div class="stage"><div class="stageheading"><div class="micro">SPEAK AND COUNT</div><h2>Formule une phrase complète en anglais.</h2><p>Aucun début de phrase n’est fourni. Certains objets peuvent apparaître plusieurs fois.</p></div><div class="countgrid">${cur.list.map(x=>`<div class="tile">${im(x)}</div>`).join('')}</div>${done?`<div class="callout">${esc(sentence(cur.list))}</div>`:''}</div><div class="buttons">${done?btn('next','Nouvelle composition →','primary'):btn('reveal','Voir une phrase possible','green')}${btn('restart','Nouvelle série')}</div>`}
function askText(){let label=cur.target.label.replace('a rubber / an eraser','a rubber');return settings.grammar==='do'?`Do you have ${label} in your pencil case?`:`Have you got ${label} in your pencil case?`}
function shortReply(){return settings.grammar==='do'?(cur.isPresent?'Yes, I do.':'No, I don’t.'):(cur.isPresent?'Yes, I have.':'No, I haven’t.')}
function renderHave(){let showQ=phase==='answer'||phase==='revealed';let done=phase==='revealed';return `<div class="stage"><div class="stageheading"><div class="micro">ASK • LOOK • ANSWER</div><h2>Pose une question sur la trousse.</h2><p>Formule la question, puis réponds en observant les objets présents.</p></div><div class="bagboard"><div class="target"><span class="tiny">OBJECT TO ASK ABOUT</span>${im(cur.target)}</div><div class="pencilbag"><div class="bagtitle">✎ INSIDE THE PENCIL CASE</div><div class="bagitems">${cur.bag.map(x=>`<div class="bagtile">${im(x)}</div>`).join('')}</div></div></div>${showQ?`<div class="questionbox">${esc(askText())}</div>`:''}${done?`<div class="answershort">${esc(shortReply())}</div>`:''}</div><div class="buttons"><label class="micro" for="grammarsel">STRUCTURE :</label><select class="optselect" id="grammarsel"><option value="do" ${settings.grammar==='do'?'selected':''}>Do you have…? / Yes, I do.</option><option value="have" ${settings.grammar==='have'?'selected':''}>Have you got…? / Yes, I have.</option></select>${phase==='formulate'?btn('showQ','Afficher la question','green'):phase==='answer'?btn('reveal','Afficher la réponse','primary'):btn('next','Nouveau dialogue →','primary')}${btn('restart','Nouvelle série')}</div>`}
function renderMatch(){let done=phase==='revealed';return `<div class="stage"><div class="stageheading"><div class="micro">LOOK • READ • CHOOSE</div><h2>${esc(cur.x.label)}</h2><p>Quelle illustration correspond à la consigne ? Réponds A, B, C ou D.</p></div><div class="fourgrid">${cur.options.map((x,k)=>`<div class="fourcard ${done&&x.id===cur.x.id?'correct':''}"><span class="letter">${'ABCD'[k]}</span>${im(x)}</div>`).join('')}</div>${done?`<div class="callout">Answer: ${cur.answer} · ${esc(cur.x.label)}</div>`:''}</div><div class="buttons">${done?btn('next','Consigne suivante →','primary'):btn('reveal','Afficher la correction','green')}${btn('restart','Nouvelle série')}</div>`}
function openModal(){let wrap=document.getElementById('modalwrap'),modal=document.getElementById('modal');modal.innerHTML=`<button class="close" data-act="close" title="Fermer">×</button><h2>⚙ Réglages de la séance</h2><div class="settingsgrid"><label>Longueur de la série<select id="rounds"><option value="random" ${settings.rounds==='random'?'selected':''}>Aléatoire : 7 à 12</option><option value="5" ${settings.rounds==='5'?'selected':''}>5 manches</option><option value="10" ${settings.rounds==='10'?'selected':''}>10 manches</option><option value="15" ${settings.rounds==='15'?'selected':''}>15 manches</option><option value="24" ${settings.rounds==='24'?'selected':''}>24 manches</option><option value="infinite" ${settings.rounds==='infinite'?'selected':''}>Sans limite</option></select></label><label>Images « In my pencil case »<select id="countN"><option value="random" ${settings.countN==='random'?'selected':''}>3 à 5 images au hasard</option>${[3,4,5].map(n=>`<option value="${n}" ${String(settings.countN)===String(n)?'selected':''}>${n} images</option>`).join('')}</select></label></div><label class="modaltxt" style="display:block;margin-top:14px"><input type="checkbox" id="repeat" ${settings.repeat?'checked':''}> Autoriser des objets en plusieurs exemplaires (activité de phrases)</label><div class="line"></div><h3>Liste des élèves</h3><p class="modaltxt">Une ligne par prénom. Tu peux modifier cette liste et décocher les élèves absents. Les changements sont conservés localement dans ce navigateur.</p><textarea id="roster" aria-label="Prénoms des élèves">${esc(settings.names.join('\n'))}</textarea><div class="modaltxt"><strong>Présents :</strong> <button class="little" data-act="allpresent">Tous</button> <button class="little" data-act="nonepresent">Aucun</button></div><div class="attendees" id="attendees">${settings.names.map(n=>`<label><input type="checkbox" class="presentcheck" data-name="${esc(n)}" ${settings.present.includes(n)?'checked':''}>${esc(n)}</label>`).join('')}</div><div class="modalfoot"><button class="btn" data-act="close">Annuler</button><button class="btn primary" data-act="save">Enregistrer</button></div><p class="modaltxt">Pour une nouvelle répartition du tirage sans répétitions, relance une série. Le mode collectif ne montre aucun prénom.</p>`;wrap.classList.add('open')}
function closeModal(){document.getElementById('modalwrap').classList.remove('open')}
function saveModal(){const typed=document.getElementById('roster').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);const seen=new Set(),names=typed.filter(n=>!seen.has(n)&&seen.add(n));if(!names.length){alert('Il faut conserver au moins un prénom.');return}let wasPresent=Array.from(document.querySelectorAll('.presentcheck:checked'),el=>el.dataset.name);let newlyAdded=names.filter(n=>!settings.names.includes(n));settings.names=names;settings.present=[...new Set([...wasPresent,...newlyAdded])].filter(n=>names.includes(n));settings.rounds=document.getElementById('rounds').value;settings.countN=document.getElementById('countN').value;settings.repeat=document.getElementById('repeat').checked;persist();closeModal();render()}
function act(name,el){switch(name){case'home':active=null;render();break;case'group':settings.mode='group';persist();render();break;case'individual':settings.mode='individual';persist();render();break;case'start':start(el.dataset.game);break;case'restart':start(active);break;case'next':next();break;case'reveal':phase=(active==='tf'?'answered':'revealed');render();break;case'hide':phase='closed';render();break;case'open':phase='guess';render();break;case'true':case'false':selectedTF=name==='true';phase='answered';render();break;case'showQ':phase='answer';render();break;case'draw':student=drawName();render();break;case'settings':openModal();break;case'close':closeModal();break;case'save':saveModal();break;case'allpresent':document.querySelectorAll('.presentcheck').forEach(x=>x.checked=true);break;case'nonepresent':document.querySelectorAll('.presentcheck').forEach(x=>x.checked=false);break;case'fullscreen':try{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}catch(e){}break}}
document.addEventListener('click',e=>{let node=e.target.closest('[data-act]');if(node){e.preventDefault();act(node.dataset.act,node)}else if(e.target===document.getElementById('modalwrap'))closeModal()});
document.addEventListener('change',e=>{if(e.target.id==='topic'){settings.topic=e.target.value;persist();render()}if(e.target.id==='pickstudent'){student=e.target.value||null;if(student&&!usedNames.includes(student))usedNames.push(student);render()}if(e.target.id==='grammarsel'){settings.grammar=e.target.value;persist();render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modalwrap').classList.contains('open')){closeModal();return}if(document.getElementById('modalwrap').classList.contains('open'))return;if(e.target.closest('select,textarea,input,button'))return;if(e.key==='f'||e.key==='F'){e.preventDefault();act('fullscreen');return}if(!active)return;if(e.code==='Space'){e.preventDefault();let a=null;if(active==='missing')a=phase==='study'?'hide':phase==='closed'?'open':phase==='guess'?'reveal':phase==='revealed'?'next':null;else if(active==='have')a=phase==='formulate'?'showQ':phase==='answer'?'reveal':phase==='revealed'?'next':null;else a=(phase==='guess'||phase==='question')?'reveal':(phase==='revealed'||phase==='answered')?'next':null;if(a)act(a)}if(e.key==='ArrowRight'&&(phase==='revealed'||phase==='answered')){e.preventDefault();next()}});
render();
</script></body></html>
