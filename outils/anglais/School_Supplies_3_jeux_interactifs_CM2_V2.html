 const before=shuffle(ITEMS).slice(0,9).map(ob=>ob.id);
 const vanishedId=sample(before);
 // L'élève voit d'abord 9 images, puis uniquement 8 images sans emplacement vide.
 const after=shuffle(before.filter(id=>id!==vanishedId));
 return {before,after,vanished:BY_ID[vanishedId],number:9};
}
function makeTF(){const obj=nextFromItemBag();const truth=nextTruth();const shown=truth?obj:sample(ITEMS.filter(i=>i.id!==obj.id));return {obj,truth,shown};}
function chooseCountN(){return opts.countSize==='random'?random(3,5):Number(opts.countSize);}
function makeCount(){const n=chooseCountN();const allowed=ITEMS.filter(x=>x.id!=='pencil_case');const duplicate=opts.dupes&&Math.random()<.74;const extra=duplicate?random(1,Math.min(2,n-2)):0;const types=n-extra;const chosen=shuffle(allowed).slice(0,types);const copies=[...chosen];for(let i=0;i<extra;i++){const pool=chosen.filter(ob=>copies.filter(x=>x===ob).length<3);copies.push(sample(pool));}return {images:shuffle(copies)};}
function makeRound(){selectedAnswer=null;student=game==='tf'?nextStudent():null;if(game==='missing'){current=makeMissing();phase='study'}else if(game==='tf'){current=makeTF();phase='question'}else{current=makeCount();phase='question'}}
function startGame(g){game=g;round=1;total=totalRounds(g);usedStudents.clear();itemBag=[];truthBag=[];makeRound();render();}
function nextRound(){if(round===total){phase='finished';render();return;}round++;makeRound();render();}
function render(){const s=$('screen');if(!game){renderHome(s);return;}if(phase==='finished'){renderEnd(s);return;}let h=`<div class="gamehead"><div><button class="back" data-action="home">← Accueil / choisir un jeu</button><h1>${GAME_TITLES[game]}</h1><div class="hint">${game==='missing'?'Observe, mémorise et retrouve l’objet disparu.':game==='tf'?'Regarde l’image, lis la phrase et décide.':'Compte les objets et construis une phrase en anglais.'}</div></div><div class="roundpill">MANCHE ${round}${total===Infinity?' · ∞':' / '+total}</div></div>`;
if(game==='missing')h+=renderMissing();else if(game==='tf')h+=renderTF();else h+=renderCount();s.innerHTML=h;}
function renderHome(s){s.innerHTML=`<div class="welcome"><div class="eyebrow">Trois jeux pour parler anglais</div><h1>School <span>supplies.</span></h1><p>Les 14 illustrations à l’aquarelle de la leçon. Des manches renouvelées aléatoirement, des corrections à afficher au clic et un choix libre ou aléatoire des élèves.</p></div><div class="gamecards"><section class="gamecard"><div class="cardvisual blue">${img(BY_ID.pencil_case)}${img(BY_ID.ruler)}</div><span class="number">JEU 01 · MÉMORISATION</span><h2>What's missing?</h2><p>Observe les objets. Fermez les yeux : ils changent de place et l’un disparaît. Retrouve le bon mot sur ton ardoise.</p><button class="launch" data-action="start" data-game="missing">Commencer l’activité <span aria-hidden="true">→</span></button></section><section class="gamecard"><div class="cardvisual green">${img(BY_ID.scissors)}${img(BY_ID.compass)}</div><span class="number">JEU 02 · VOCABULAIRE</span><h2>True or false?</h2><p>Une image, une affirmation en anglais, et la possibilité de choisir un élève ou de le tirer au sort.</p><button class="launch" data-action="start" data-game="tf">Commencer l’activité <span aria-hidden="true">→</span></button></section><section class="gamecard"><div class="cardvisual amber doubled">${img(BY_ID.set_square)}${img(BY_ID.set_square)}</div><span class="number">JEU 03 · EXPRESSION ORALE</span><h2>Décris les objets</h2><p>De 3 à 5 objets, parfois identiques. Compte-les et formule une phrase complète : <i>one pen, two rulers…</i></p><button class="launch" data-action="start" data-game="count">Commencer l’activité <span aria-hidden="true">→</span></button></section></div><div class="fineprint"><span>✓ Fonctionne hors connexion · aucune image à charger</span><span>⚙ Réglages : nombre de manches, absents et tirage des prénoms</span></div>`;}
function renderSlots(slots,after=false){return `<div class="missinggrid ${after?'after':''}" aria-label="${after?'Huit':'Neuf'} fournitures scolaires">${slots.map(id=>`<div class="supplyslot">${img(BY_ID[id],'','Illustration de fourniture scolaire')}</div>`).join('')}</div>`;}
function renderMissing(){const c=current,visible=(phase==='study')?c.before:c.after;let heading=phase==='study'?'Look carefully!':phase==='revealed'?'Well done!':'What’s missing?';let help=phase==='study'?'Mémorisez bien ces 9 objets.':phase==='revealed'?'Voici la fourniture qui avait disparu.':'Regardez les 8 objets restants. Écrivez le mot disparu sur l’ardoise.';
let overlay=phase==='closed'?`<div class="conceal"><div class="bigeye">🙈</div><h2>Close your eyes!</h2><p>Un objet a disparu et les huit autres sont mélangés.<br>Quand tout le monde est prêt, découvrez la nouvelle disposition.</p><button data-action="openEyes">Open your eyes →</button></div>`:'';
let answer=phase==='revealed'?`<div class="answerpanel">${img(c.vanished)}<div><small>The missing object was…</small><strong>${escapeHTML(c.vanished.label)}</strong></div></div>`:'';
return `<div class="stage st-missing"><div class="stagehead"><span class="kicker">${phase==='study'?'9 objets au départ':'8 objets après le mélange'}</span><h2>${heading}</h2><p>${help}</p></div>${renderSlots(visible,phase!=='study')}${answer}${overlay}</div><div class="footeractions">${phase==='study'?'<button class="btn primary" data-action="closeEyes">Fermez les yeux →</button>':phase==='closed'?'':phase==='guess'?'<button class="btn teal" data-action="reveal">Afficher la réponse</button>':'<button class="btn primary" data-action="next">Manche suivante →</button>'}<button class="btn secondary" data-action="restart">Recommencer ce jeu</button></div><div class="footerhelper">9 fournitures différentes au départ. Une disparaît ; les 8 restantes sont remélangées sans cases vides.</div>`;}
function renderTF(){const c=current;const done=phase==='answered';
 const names=opts.attendees.map(name=>`<option value="${escapeHTML(name)}" ${student===name?'selected':''}>${escapeHTML(name)}</option>`).join('');
 const picker=`<label class="picklabel">Élève : <select id="studentPicker" aria-label="Choisir manuellement un élève"><option value="">— À choisir —</option>${names}</select></label>`;
 const sel=student?`<span class="studentname">🎯 ${escapeHTML(student)}</span>`:`<span class="studentname off">Choisis un élève</span>`;
 const result=done?`<div class="feedback ${selectedAnswer===c.truth?'success':'error'}"><strong>${selectedAnswer===c.truth?'✓ Bonne réponse !':'✗ Ce n’est pas la bonne réponse.'}</strong><div>La bonne réponse était <b>${c.truth?'TRUE':'FALSE'}</b>. ${c.truth?'':'L’image représente : <b>'+escapeHTML(c.obj.label)+'</b>.'}</div></div>`:'';
 return `<div class="stage tf-stage"><div class="studentstrip">${picker}${sel}<button class="smallbtn" data-action="redraw" title="Tirer un élève présent au sort">🎲 Au hasard</button><span class="pickhint">${opts.useNames?'Tirage auto activé':'Choix manuel'}</span></div>${img(c.obj,'tf-image','Illustration à identifier')}<div class="statement">${escapeHTML(c.shown.statement)}</div>${done?result:`<div class="tf-choices"><button class="tfbtn yes" data-action="answerTrue">✓ TRUE</button><button class="tfbtn no" data-action="answerFalse">✕ FALSE</button></div>`}</div><div class="footeractions">${done?'<button class="btn primary" data-action="next">Question suivante →</button>':'<span class="mini-note">L’élève indique TRUE ou FALSE avant la correction.</span>'}<button class="btn secondary" data-action="restart">Recommencer ce jeu</button></div><div class="footerhelper">Sélectionne le prénom dans la liste, ou utilise « Au hasard ».</div>`;}
function amountWords(n,one,many){return n===1?'one '+one:n===2?'two '+many:n===3?'three '+many:n===4?'four '+many:'five '+many;}
function countSentence(images){const order=[],quant={};for(const ob of images){if(!quant[ob.id]){order.push(ob);quant[ob.id]=0;}quant[ob.id]++;}const parts=order.map(ob=>amountWords(quant[ob.id],ob.unit,ob.plural));return 'In my pencil case, I have got '+(parts.length>1?parts.slice(0,-1).join(', ')+' and '+parts.at(-1):parts[0])+'.';}
function renderCount(){const images=current.images;const done=phase==='revealed';return `<div class="stage count-stage"><div class="stagehead"><div class="kicker">Observe · ${images.length} objets</div><h2>À toi de parler !</h2><p>Formule une phrase complète en anglais, sans modèle écrit.</p></div><div class="countgrid">${images.map(ob=>`<div class="countcard">${img(ob,'','Fourniture scolaire à compter')}</div>`).join('')}</div>${done?`<div class="sentenceanswer">${escapeHTML(countSentence(images))}</div><div class="countnote">On peut aussi dire <i>eraser</i> (US) pour <i>rubber</i> (UK). Les ciseaux se comptent en <i>pairs of scissors</i>.</div>`:''}</div><div class="footeractions">${done?'<button class="btn primary" data-action="next">Manche suivante →</button>':'<button class="btn teal" data-action="reveal">Afficher la correction</button>'}<button class="btn secondary" data-action="restart">Recommencer ce jeu</button></div><div class="footerhelper">Les objets peuvent être présents plusieurs fois. La phrase n’apparaît qu’après la réponse des élèves.</div>`;}
function renderEnd(s){s.innerHTML=`<div class="gamehead"><div><button class="back" data-action="home">← Accueil / choisir un jeu</button><h1>${GAME_TITLES[game]}</h1></div><span class="roundpill">TERMINÉ</span></div><div class="stage endstage"><div class="endicon">🏆</div><div class="eyebrow">Mission completed</div><h2>Great job!</h2><p>Vous avez terminé ${total} manches de <strong>${GAME_TITLES[game]}</strong>. Vous pouvez relancer une nouvelle série : les images et les questions seront à nouveau mélangées.</p><div class="endactions"><button class="btn primary" data-action="restart">Nouvelle série ↻</button><button class="btn secondary" data-action="home">Choisir un autre jeu</button></div></div>`;}
function openSettings(){const modal=$('modalBody');const sel=(name,value,options)=>`<label class="fieldlabel">${name}<select id="${value}">${options.map(([v,t])=>`<option value="${v}" ${String(opts[value]||'')===v?'selected':''}>${t}</option>`).join('')}</select></label>`;
const roundSel=(g)=>`<label class="fieldlabel">${GAME_TITLES[g]}<select data-rounds="${g}">${[['random','Aléatoire : 7 à 12'],['5','5 manches'],['8','8 manches'],['12','12 manches'],['16','16 manches'],['24','24 manches'],['infinite','Sans limite']].map(([v,t])=>`<option value="${v}" ${opts.rounds[g]===v?'selected':''}>${t}</option>`).join('')}</select></label>`;
modal.innerHTML=`<div class="modalhead"><h2>⚙ Réglages de la séance</h2><button class="closebtn" data-action="closeSettings" aria-label="Fermer">×</button></div><div class="sectionlabel">Nombre de manches</div><div class="settinggrid">${roundSel('missing')}${roundSel('tf')}${roundSel('count')}</div><div class="sectionlabel">Variantes des activités</div><div class="settinggrid"><div class="fieldlabel">What’s missing?<div style="margin-top:9px;font-size:14px;font-weight:700;color:#213d57;padding:12px;background:#f1f6ff;border-radius:10px">9 objets visibles, puis 8 remélangés, sans case vide.</div></div><label class="fieldlabel">In my pencil case · quantité d’images<select id="countSize">${[['random','Aléatoire : 3 à 5'],['3','3 images'],['4','4 images'],['5','5 images']].map(([v,t])=>`<option value="${v}" ${opts.countSize===v?'selected':''}>${t}</option>`).join('')}</select></label></div><label class="toggleline"><input type="checkbox" id="dupes" ${opts.dupes?'checked':''}> Autoriser les fournitures en plusieurs exemplaires</label><div class="sectionlabel">Choix des élèves <span id="studentCount" style="color:#64748b;font-size:12px">${opts.attendees.length}/24 présents</span></div><label class="toggleline"><input type="checkbox" id="useNames" ${opts.useNames?'checked':''}> Tirer automatiquement un élève au début de chaque question (désactivable en sélectionnant un prénom pendant le jeu)</label><div class="rosterhelp">Décoche les absents : ils disparaîtront du menu de sélection et du tirage. Tu peux choisir manuellement un prénom à chaque question. Les tirages automatiques évitent les répétitions avant d’avoir fait passer tous les élèves présents. Les réglages restent dans ce navigateur.</div><div class="rostercontrols"><span style="font-size:12px;color:#607189;font-weight:750">Liste de classe · 24 élèves</span><div><button data-action="allPresent">Tous présents</button> <button data-action="nonePresent">Tout décocher</button></div></div><div class="roster">${STUDENTS.map(name=>`<label><input class="presence" type="checkbox" data-name="${escapeHTML(name)}" ${opts.attendees.includes(name)?'checked':''}>${escapeHTML(name)}</label>`).join('')}</div><div class="modalactions"><button class="btn secondary" data-action="closeSettings">Annuler</button><button class="btn primary" data-action="saveSettings">Enregistrer</button></div><div class="modalfoot">Les réglages des manches sont appliqués lors du prochain lancement d’un jeu. L’activation du tirage s’applique immédiatement.</div>`;
$('settingsOverlay').classList.add('active');}
function closeSettings(){$('settingsOverlay').classList.remove('active');}
function saveSettings(){for(const el of document.querySelectorAll('select[data-rounds]'))opts.rounds[el.dataset.rounds]=el.value;opts.countSize=$('countSize').value;opts.dupes=$('dupes').checked;opts.useNames=$('useNames').checked;opts.attendees=Array.from(document.querySelectorAll('.presence:checked'),el=>el.dataset.name);save();closeSettings();if(game==='tf'&&phase==='question'){student=opts.useNames?nextStudent():null;}render();}
function updatePresenceText(){let node=$('studentCount');if(node)node.textContent=document.querySelectorAll('.presence:checked').length+'/24 présents';}
function redrawStudent(){opts.useNames=true;save();student=nextStudent(true);render();}
function selectStudent(name){opts.useNames=false;save();student=name&&opts.attendees.includes(name)?name:null;render();}
function fullscreen(){try{if(!document.fullscreenElement){let p=document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{});}else if(document.exitFullscreen)document.exitFullscreen();}catch(e){}}
function onAction(action,el){switch(action){case'home':game=null;render();break;case'fullscreen':fullscreen();break;case'settings':openSettings();break;case'closeSettings':closeSettings();break;case'clear':break;case'start':startGame(el.dataset.game);break;case'closeEyes':if(game==='missing'&&phase==='study'){phase='closed';render();}break;case'openEyes':if(game==='missing'&&phase==='closed'){phase='guess';render();}break;case'reveal':if(game==='missing'&&phase==='guess'||game==='count'&&phase==='question'){phase='revealed';render();}break;case'answerTrue':case'answerFalse':if(game==='tf'&&phase==='question'){selectedAnswer=action==='answerTrue';phase='answered';render();}break;case'next':nextRound();break;case'restart':startGame(game);break;case'redraw':redrawStudent();break;case'allPresent':document.querySelectorAll('.presence').forEach(el=>el.checked=true);updatePresenceText();break;case'nonePresent':document.querySelectorAll('.presence').forEach(el=>el.checked=false);updatePresenceText();break;case'saveSettings':saveSettings();break;}}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(target){e.preventDefault();onAction(target.dataset.action,target);}else if(e.target===$('settingsOverlay'))closeSettings();});document.addEventListener('change',e=>{if(e.target.matches('.presence'))updatePresenceText();if(e.target.id==='studentPicker')selectStudent(e.target.value);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('settingsOverlay').classList.contains('active')){closeSettings();return;}if($('settingsOverlay').classList.contains('active'))return;if(e.target.closest('select,input,textarea,button'))return;if(e.code==='Space'){e.preventDefault();if(game==='missing'){if(phase==='study')onAction('closeEyes');else if(phase==='closed')onAction('openEyes');else if(phase==='guess')onAction('reveal');else if(phase==='revealed')onAction('next');}else if(game==='count'){if(phase==='question')onAction('reveal');else if(phase==='revealed')onAction('next');}else if(game==='tf'&&phase==='answered')onAction('next');}else if(e.key.toLowerCase()==='f'&&!e.ctrlKey&&!e.altKey&&!e.metaKey)fullscreen();else if(e.key==='ArrowRight'&&(phase==='revealed'||phase==='answered'))nextRound();});
render();
</script>
</body>
